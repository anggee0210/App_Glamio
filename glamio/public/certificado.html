<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    /* Hoja A4 apaisada (297 × 210 mm). container-type permite usar "cqw":
       1cqw = 1 % del ancho del certificado, así el texto crece y encoge con la hoja. */
    .certificado { --texto: #3a2f36; position: relative; width: 100%; max-width: 1000px; margin: 16px auto;
      aspect-ratio: 297 / 210; container-type: inline-size; color: var(--texto);
      background: #fff center / cover no-repeat; border-radius: var(--radio); overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    /* Diseño por defecto, si la administradora no ha subido ningún fondo */
    .certificado.sin-fondo { border: 1.2cqw double var(--rosa); }

    .contenido { position: absolute; inset: 10% 11%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; }
    .contenido .marca { font-weight: 800; letter-spacing: .3cqw; color: var(--rosa); font-size: 2.6cqw; margin: 0; }
    .contenido .tipo { text-transform: uppercase; letter-spacing: .4cqw; font-size: 2.4cqw; margin: 1cqw 0 2.5cqw; }
    .contenido .pequeno { font-size: 1.8cqw; margin: .6cqw 0; }
    .contenido .nombre { font-size: 4.6cqw; margin: .8cqw 0 1.4cqw; font-weight: 700; }
    .contenido .curso { font-size: 3.2cqw; margin: .6cqw 0; font-weight: 700; }

    .pie { position: absolute; left: 11%; right: 11%; bottom: 9%; display: flex;
      justify-content: space-between; align-items: flex-end; gap: 2cqw; font-size: 1.5cqw; }
    .datos p { margin: .3cqw 0; text-align: left; }
    .firma { text-align: center; min-width: 22cqw; }
    .firma img { max-height: 7cqw; max-width: 24cqw; display: block; margin: 0 auto -0.5cqw; }
    .firma .manuscrita { font-family: 'Brush Script MT', 'Segoe Script', cursive; font-size: 3.4cqw; margin: 0; }
    .firma .linea { border-top: .15cqw solid currentColor; padding-top: .5cqw; }

    /* Sello dibujado con CSS: un círculo con borde doble */
    .sello { width: 13cqw; height: 13cqw; border-radius: 50%; border: .5cqw double var(--rosa);
      color: var(--rosa); display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; transform: rotate(-12deg); background: rgba(255,255,255,.75); }
    .sello strong { font-size: 2cqw; letter-spacing: .2cqw; }
    .sello span { font-size: 1.15cqw; text-transform: uppercase; line-height: 1.2; }

    .aviso-prueba { max-width: 1000px; margin: 10px auto 0; }

    /* Al imprimir o guardar en PDF: A4 apaisado, sin márgenes y solo el certificado */
    @page { size: A4 landscape; margin: 0; }
    @media print {
      .no-imprimir { display: none !important; }
      body, main { margin: 0; padding: 0; background: #fff; }
      .certificado { width: 297mm; height: 210mm; max-width: none; margin: 0; border-radius: 0; box-shadow: none;
        -webkit-print-color-adjust: exact; print-color-adjust: exact; } /* imprime también el fondo */
    }
  </style>
</head>
<body>
  <main>
    <p class="no-imprimir fila" style="justify-content:space-between">
      <a id="volver" href="/index.html">← Volver al curso</a>
      <a id="mis-certificados" href="/certificados.html">🎓 Mis certificados</a>
    </p>
    <p class="mensaje aviso-prueba no-imprimir oculto" id="aviso-prueba">
      👀 <strong>Vista previa</strong> con datos de ejemplo. El diseño se cambia en el Panel → «Diseño del certificado».</p>
    <div class="certificado" id="cert"><p style="padding:20px">Cargando...</p></div>
    <p class="no-imprimir" style="text-align:center">
      <button class="boton oculto" id="imprimir" onclick="print()">Imprimir / Guardar PDF</button>
    </p>
  </main>
  <script src="/js/api.js"></script>
  <script>
    const cursoId = param('curso');
    const esVistaPrevia = param('vista_previa') === '1';

    // Datos inventados para la vista previa del Panel
    const EJEMPLO = { nombre: 'Nombre de la alumna', perfil: 'alumna', titulo: 'Manicura básica',
                      categoria: 'Uñas', lecciones: 5, numero: 0, fecha: new Date().toISOString() };

    function pintar(c, d) {
      const cert = document.getElementById('cert');
      cert.style.setProperty('--texto', d.color_texto);
      if (d.fondo) cert.style.backgroundImage = `url("${d.fondo}")`;
      else cert.classList.add('sin-fondo');

      // La fecha viene del servidor (cuándo terminó el curso), así no cambia cada día
      const fecha = new Date(c.fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      const numero = 'GLAMIO-' + String(c.numero).padStart(5, '0');
      const certificada = c.perfil === 'profesional' ? 'Profesional certificada' : 'Alumna certificada';
      // Firma: la imagen escaneada si existe; si no, el nombre con letra de escritura a mano
      const firma = d.firma
        ? `<img src="${d.firma}" alt="Firma">`
        : (d.directora ? `<p class="manuscrita">${esc(d.directora)}</p>` : '');

      cert.innerHTML = `
        <div class="contenido">
          ${d.fondo ? '' : '<p class="marca">GLAMIO</p>'}
          <p class="tipo">Certificado de finalización</p>
          <p class="pequeno">Se certifica que</p>
          <p class="nombre">${esc(c.nombre)}</p>
          <p class="pequeno">ha completado el curso</p>
          <p class="curso">${esc(c.titulo)}</p>
          <p class="pequeno">${esc(c.categoria)} · Curso de ${c.lecciones} ${c.lecciones === 1 ? 'lección' : 'lecciones'}</p>
        </div>
        <div class="pie">
          <div class="datos">
            <p>Terminado el ${fecha}</p>
            <p>Nº ${numero}</p>
          </div>
          <div class="firma">
            ${firma}
            <div class="linea">${d.directora ? esc(d.directora) + '<br>' : ''}Directora académica</div>
          </div>
          <div class="sello"><strong>GLAMIO</strong><span>${certificada}</span></div>
        </div>`;
      document.getElementById('imprimir').classList.remove('oculto');
    }

    async function iniciar() {
      try {
        const d = await api('/api/academia/certificado');
        if (esVistaPrevia) {
          document.getElementById('aviso-prueba').classList.remove('oculto');
          document.getElementById('volver').href = '/admin.html';
          document.getElementById('volver').textContent = '← Volver al Panel';
          document.getElementById('mis-certificados').classList.add('oculto'); // la admin no tiene certificados
          document.title = 'Vista previa del certificado – GLAMIO';
          return pintar(EJEMPLO, d);
        }
        document.getElementById('volver').href = '/curso.html?id=' + cursoId;
        const c = await api(`/api/cursos/${cursoId}/certificado`);
        document.title = 'Certificado · ' + c.titulo + ' – GLAMIO';
        pintar(c, d);
      } catch (err) {
        document.getElementById('cert').innerHTML = `<p style="padding:20px">${esc(err.message)}</p>`;
      }
    }
    iniciar();
  </script>
</body>
</html>
