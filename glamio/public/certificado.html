<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/certificado-plantilla.css">
  <style>
    .aviso-prueba { max-width: 1000px; margin: 10px auto 0; }

    /* Al imprimir o guardar en PDF: hoja carta apaisada, sin márgenes y solo el certificado */
    @page { size: letter landscape; margin: 0; }
    @media print {
      .no-imprimir { display: none !important; }
      body, main { margin: 0; padding: 0; background: #fff; }
      .certificado { width: 279.4mm; height: 215.9mm; max-width: none; margin: 0; border-radius: 0; box-shadow: none;
        -webkit-print-color-adjust: exact; print-color-adjust: exact; } /* imprime también el fondo */
    }
  </style>
</head>
<body>
  <main>
    <p class="no-imprimir fila" style="justify-content:space-between">
      <a id="volver" href="/index.html">← Volver al curso</a>
      <a id="mis-certificados" href="/certificados.html">🎓 Mis certificados</a>
    </p>
    <p class="mensaje aviso-prueba no-imprimir oculto" id="aviso-prueba">
      👀 <strong>Vista previa</strong> con datos de ejemplo. El diseño se cambia en el Panel → «Diseño del certificado».</p>
    <div class="certificado" id="cert"><p style="padding:20px">Cargando...</p></div>
    <p class="no-imprimir" style="text-align:center">
      <button class="boton oculto" id="imprimir" onclick="print()">Imprimir / Guardar PDF</button>
    </p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/certificado-plantilla.js"></script>
  <script>
    const cursoId = param('curso');
    const esVistaPrevia = param('vista_previa') === '1';

    // Datos inventados para la vista previa del Panel
    const EJEMPLO = { nombre: 'Nombre de la alumna', perfil: 'alumna', titulo: 'Manicura básica',
                      categoria: 'Uñas', lecciones: 5, numero: 0, fecha: new Date().toISOString() };

    // El certificado es SIEMPRE el que sube la administradora: su fondo y, encima,
    // los datos en las posiciones que ella eligió en el Panel (htmlPlantilla está en
    // /js/certificado-plantilla.js). Mientras no suba un fondo, la hoja sale en blanco con los datos.
    function pintar(c, d) {
      const cert = document.getElementById('cert');
      cert.style.setProperty('--texto', d.color_texto);
      cert.style.backgroundImage = d.fondo ? `url("${d.fondo}")` : 'none';
      cert.innerHTML = htmlPlantilla(c, d, d.posiciones);
      document.getElementById('imprimir').classList.remove('oculto');
    }

    async function iniciar() {
      try {
        const d = await api('/api/academia/certificado');
        if (esVistaPrevia) {
          document.getElementById('aviso-prueba').classList.remove('oculto');
          document.getElementById('volver').href = '/admin.html';
          document.getElementById('volver').textContent = '← Volver al Panel';
          document.getElementById('mis-certificados').classList.add('oculto'); // la admin no tiene certificados
          document.title = 'Vista previa del certificado – GLAMIO';
          return pintar(EJEMPLO, d);
        }
        document.getElementById('volver').href = '/curso.html?id=' + cursoId;
        const c = await api(`/api/cursos/${cursoId}/certificado`);
        document.title = 'Certificado · ' + c.titulo + ' – GLAMIO';
        pintar(c, d);
      } catch (err) {
        document.getElementById('cert').innerHTML = `<p style="padding:20px">${esc(err.message)}</p>`;
      }
    }
    iniciar();
  </script>
</body>
</html>
