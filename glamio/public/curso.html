<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <div id="curso"></div>

    <!-- Resumen del pago simulado (solo cursos de pago). No pide datos de tarjeta. -->
    <section id="resumen-pago" class="tarjeta oculto" style="margin-top:12px">
      <h2 style="margin-top:0">Inscripción</h2>
      <p>Curso: <strong id="pago-curso"></strong></p>
      <p>Total: <strong id="pago-total"></strong></p>
      <p class="mensaje">ℹ️ <strong>Pago simulado:</strong> es una demo, no se cobra nada.</p>
      <div class="fila">
        <button class="boton" id="pagar"></button>
        <button type="button" class="boton secundario" id="cancelar-pago">Cancelar</button>
      </div>
    </section>
    <p class="mensaje error oculto" id="error"></p>

    <section id="zona-progreso" class="oculto">
      <h2>Tu progreso</h2>
      <div class="barra"><div id="barra" style="width:0%"></div></div>
      <p id="texto-progreso"></p>
      <a id="certificado" class="boton oculto" href="#">Ver mi certificado</a>
    </section>

    <h2>Lecciones</h2>
    <ol id="lecciones" style="padding-left:20px"></ol>

    <h2>Materiales</h2>
    <ul id="materiales" style="padding-left:20px"></ul>
    <a class="boton secundario" id="ir-calculadora" href="#" style="margin-top:10px;display:inline-block">Calcular mi precio con estos materiales</a>

    <h2>Reseñas</h2>
    <form id="form-resena" class="tarjeta oculto">
      <label>Estrellas
        <select name="estrellas"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
      </label>
      <label>Comentario <textarea name="comentario" rows="3"></textarea></label>
      <label>Foto de tu resultado (opcional) <input type="file" name="foto" accept="image/*"></label>
      <button class="boton">Publicar reseña</button>
    </form>
    <div id="resenas"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const id = param('id');
    let usuaria = null;
    let curso = null;
    let inscrita = false;
    let completadas = []; // ids de las lecciones que ya ha hecho

    // Perfiles que pueden hacer cursos (el servidor lo comprueba también)
    const PUEDEN_INSCRIBIRSE = ['alumna', 'profesional'];

    // 25 → "25,00 €"   0 → "Gratis"
    function precioTexto(precio) {
      const n = Number(precio);
      return n === 0 ? 'Gratis' : n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
    }

    function mostrarError(texto) {
      const caja = document.getElementById('error');
      caja.textContent = texto;
      caja.classList.remove('oculto');
    }

    async function iniciar() {
      usuaria = await pintarCabecera();
      try {
        curso = await api('/api/cursos/' + id);
      } catch (err) {
        // Curso que no existe (o enlace mal copiado)
        document.querySelector('main').innerHTML =
          `<p class="mensaje">${esc(err.message)}</p><a href="/index.html">← Ver todos los cursos</a>`;
        return;
      }
      document.title = curso.titulo + ' – GLAMIO';
      pintarCabeceraCurso();
      document.getElementById('materiales').innerHTML =
        curso.materiales.map(m => `<li>${esc(m.nombre)} ${m.cantidad ? '(' + esc(m.cantidad) + ')' : ''}</li>`).join('')
        || '<li class="ayuda">Este curso no tiene lista de materiales.</li>';
      document.getElementById('ir-calculadora').href = '/calculadora.html?curso=' + id;

      if (usuaria) await cargarProgreso();
      pintarLecciones();
      cargarResenas();
    }

    // Portada, título, precio y el botón (o aviso) según quién mira la página
    function pintarCabeceraCurso() {
      let accion = '';
      if (!usuaria) {
        accion = '<p><a href="/login.html">Entra</a> o <a href="/registro.html">regístrate</a> para inscribirte.</p>';
      } else if (usuaria.perfil === 'administradora') {
        accion = '<p class="ayuda">Eres la administradora: este curso se edita desde el <a href="/admin.html">Panel</a>.</p>';
      } else if (!PUEDEN_INSCRIBIRSE.includes(usuaria.perfil)) {
        accion = '<p class="ayuda">Los cursos son para alumnas y profesionales.</p>';
      } else if (!inscrita) {
        accion = `<button class="boton" id="inscribirse" style="margin-top:10px">
          ${Number(curso.precio) > 0 ? 'Inscribirme · ' + precioTexto(curso.precio) : 'Inscribirme gratis'}</button>`;
      }
      document.getElementById('curso').innerHTML = `
        ${curso.imagen ? `<img src="${curso.imagen}" alt="" class="portada">` : ''}
        <span class="etiqueta">${esc(curso.categoria)}</span>
        <h1>${esc(curso.titulo)}</h1>
        <p>${esc(curso.descripcion)}</p>
        <p class="precio">${precioTexto(curso.precio)}</p>
        ${accion}`;
      const btn = document.getElementById('inscribirse');
      if (btn) btn.onclick = alPulsarInscribirme;
    }

    // Lecciones: 🔒 si no está inscrita, ✅ si ya la ha hecho
    function pintarLecciones() {
      const puedeVer = inscrita || (usuaria && usuaria.perfil === 'administradora');
      document.getElementById('lecciones').innerHTML = curso.lecciones.map(l => {
        if (!puedeVer) return `<li class="bloqueada">🔒 ${esc(l.titulo)}</li>`;
        const hecha = completadas.includes(l.id) ? ' ✅' : '';
        return `<li><a href="/leccion.html?id=${l.id}">${esc(l.titulo)}</a>${hecha}</li>`;
      }).join('') || '<li class="ayuda">Este curso todavía no tiene lecciones.</li>';
    }

    // Gratis → se inscribe directamente. De pago → primero el resumen del pago simulado.
    async function alPulsarInscribirme() {
      document.getElementById('error').classList.add('oculto');
      if (Number(curso.precio) === 0) return inscribirse({});
      document.getElementById('pago-curso').textContent = curso.titulo;
      document.getElementById('pago-total').textContent = precioTexto(curso.precio);
      document.getElementById('pagar').textContent = `Pagar ${precioTexto(curso.precio)} (simulado)`;
      document.getElementById('resumen-pago').classList.remove('oculto');
      document.getElementById('inscribirse').classList.add('oculto');
    }

    document.getElementById('cancelar-pago').onclick = () => {
      document.getElementById('resumen-pago').classList.add('oculto');
      document.getElementById('inscribirse').classList.remove('oculto');
    };

    document.getElementById('pagar').onclick = () => inscribirse({ pago_simulado: true });

    async function inscribirse(datos) {
      try {
        await api(`/api/cursos/${id}/inscribirse`, { method: 'POST', body: datos });
        document.getElementById('resumen-pago').classList.add('oculto');
        await cargarProgreso();
        pintarLecciones();
      } catch (err) { mostrarError(err.message); }
    }

    async function cargarProgreso() {
      try {
        const p = await api(`/api/cursos/${id}/progreso`);
        inscrita = p.terminado !== null; // null = no hay inscripción
        completadas = p.completadas || [];
        pintarCabeceraCurso(); // para quitar el botón "Inscribirme" si ya lo está
        if (!inscrita) return;
        document.getElementById('zona-progreso').classList.remove('oculto');
        document.getElementById('barra').style.width = (p.terminado ? 100 : p.porcentaje) + '%';
        let texto = `${p.hechas} de ${p.total} lecciones (${p.porcentaje}%)`;
        if (p.terminado) {
          // Si se añadieron lecciones después de terminar, el curso SIGUE terminado (decisión del proyecto)
          const nuevas = p.total - p.hechas;
          texto = '¡Curso terminado! 🎉' + (nuevas > 0 ? ` Hay ${nuevas} ${nuevas === 1 ? 'lección nueva' : 'lecciones nuevas'} por si quieres verlas.` : '');
          const cert = document.getElementById('certificado');
          cert.href = '/certificado.html?curso=' + id;
          cert.classList.remove('oculto');
          document.getElementById('form-resena').classList.remove('oculto');
        }
        document.getElementById('texto-progreso').textContent = texto;
      } catch (e) { /* sin sesión: no se muestra el progreso */ }
    }

    async function cargarResenas() {
      const resenas = await api('/api/resenas?curso=' + id);
      document.getElementById('resenas').innerHTML = resenas.map(r => `
        <div class="tarjeta" style="margin-bottom:10px">
          <span class="etiqueta">${esc(r.insignia)}</span>
          <p><strong>${esc(r.nombre)}</strong> · ${'⭐'.repeat(r.estrellas)}</p>
          <p>${esc(r.comentario)}</p>
          ${r.foto ? `<img src="${r.foto}" alt="" style="max-width:200px">` : ''}
          ${r.respuesta_admin ? `<p class="mensaje"><strong>GLAMIO responde:</strong> ${esc(r.respuesta_admin)}</p>` : ''}
        </div>`).join('') || '<p>Todavía no hay reseñas.</p>';
    }

    document.getElementById('form-resena').onsubmit = async (e) => {
      e.preventDefault();
      const datos = new FormData(e.target);
      datos.append('curso_id', id);
      try {
        await api('/api/resenas', { method: 'POST', body: datos });
        e.target.classList.add('oculto');
        cargarResenas();
      } catch (err) { alert(err.message); }
    };

    iniciar();
  </script>
</body>
</html>
