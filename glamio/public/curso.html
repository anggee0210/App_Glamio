<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <div id="curso"></div>

    <!-- Resumen del pago simulado (solo cursos de pago). No pide datos de tarjeta. -->
    <section id="resumen-pago" class="tarjeta oculto" style="margin-top:12px">
      <h2 style="margin-top:0">Inscripción</h2>
      <p>Curso: <strong id="pago-curso"></strong></p>
      <p>Total: <strong id="pago-total"></strong></p>
      <p class="mensaje">ℹ️ <strong>Pago simulado:</strong> es una demo, no se cobra nada.</p>
      <div class="fila">
        <button class="boton" id="pagar"></button>
        <button type="button" class="boton secundario" id="cancelar-pago">Cancelar</button>
      </div>
    </section>
    <p class="mensaje error oculto" id="error"></p>

    <section id="zona-progreso" class="oculto">
      <!-- Igual que en Materiales: el título y su opción en la misma línea, sin tapar nada.
           El certificado solo aparece con el curso terminado (ver cargarProgreso) -->
      <div class="titulo-con-opcion">
        <h2>Tu progreso</h2>
        <a id="certificado" class="boton-opcion oculto" href="#" title="Abre tu certificado para verlo o imprimirlo">🎓 Ver mi certificado</a>
      </div>
      <div class="barra"><div id="barra" style="width:0%"></div></div>
      <p id="texto-progreso"></p>
    </section>

    <h2>Lecciones</h2>
    <ol id="lecciones" style="padding-left:20px"></ol>

    <!-- Título + opción pequeña a la derecha, en la misma línea: así no tapa ni empuja la lista.
         La opción está oculta al principio: solo aparece si está inscrita (ver pintarCabeceraCurso) -->
    <div class="titulo-con-opcion">
      <h2>Materiales</h2>
      <a class="boton-opcion oculto" id="ir-calculadora" href="#" title="Abre la calculadora con estos materiales ya cargados">🧮 Calcular mi precio</a>
    </div>
    <ul id="materiales" style="padding-left:20px"></ul>

    <!-- Título + media de estrellas a la derecha ("★ 4,5 · 3 reseñas") -->
    <div class="titulo-con-opcion">
      <h2>Reseñas</h2>
      <span class="media-estrellas" id="media"></span>
    </div>
    <p class="mensaje oculto" id="msg-resenas"></p>

    <!-- Solo con el curso terminado y si aún no lo ha reseñado (RN-18 y RN-19) -->
    <form id="form-resena" class="tarjeta oculto" style="margin-bottom:12px">
      <p style="margin:0 0 6px"><strong>¿Qué te ha parecido el curso?</strong></p>
      <!-- 5 botones en vez de un desplegable: se pulsa la estrella y se pintan hasta ahí -->
      <div class="elegir-estrellas" id="elegir-estrellas" role="radiogroup" aria-label="Elige de 1 a 5 estrellas">
        <button type="button" data-valor="1" aria-label="1 estrella">★</button>
        <button type="button" data-valor="2" aria-label="2 estrellas">★</button>
        <button type="button" data-valor="3" aria-label="3 estrellas">★</button>
        <button type="button" data-valor="4" aria-label="4 estrellas">★</button>
        <button type="button" data-valor="5" aria-label="5 estrellas">★</button>
        <span class="ayuda" id="texto-estrellas" style="display:inline;margin-left:8px">Pulsa una estrella</span>
      </div>
      <input type="hidden" name="estrellas">
      <label>Comentario (opcional) <textarea name="comentario" rows="3" maxlength="1000" placeholder="Cuenta qué aprendiste y qué mejorarías"></textarea></label>
      <label>Foto de tu resultado (opcional) <input type="file" name="foto" accept="image/*"></label>
      <p class="ayuda" id="ayuda-resena"></p>
      <button class="boton" id="publicar-resena" style="margin-top:8px">Publicar reseña</button>
    </form>
    <div id="resenas"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const id = param('id');
    let usuaria = null;
    let curso = null;
    let inscrita = false;
    let terminado = false; // curso terminado → puede reseñar (RN-18)
    let completadas = []; // ids de las lecciones que ya ha hecho

    // Perfiles que pueden hacer cursos (el servidor lo comprueba también)
    const PUEDEN_INSCRIBIRSE = ['alumna', 'profesional'];

    // 25 → "25,00 €"   0 → "Gratis"
    function precioTexto(precio) {
      const n = Number(precio);
      return n === 0 ? 'Gratis' : n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
    }

    function mostrarError(texto) {
      const caja = document.getElementById('error');
      caja.textContent = texto;
      caja.classList.remove('oculto');
    }

    async function iniciar() {
      usuaria = await pintarCabecera();
      try {
        curso = await api('/api/cursos/' + id);
      } catch (err) {
        // Curso que no existe (o enlace mal copiado)
        document.querySelector('main').innerHTML =
          `<p class="mensaje">${esc(err.message)}</p><a href="/index.html">← Ver todos los cursos</a>`;
        return;
      }
      document.title = curso.titulo + ' – GLAMIO';
      pintarCabeceraCurso();
      document.getElementById('materiales').innerHTML =
        curso.materiales.map(m => `<li>${esc(m.nombre)} ${m.cantidad ? '(' + esc(m.cantidad) + ')' : ''}</li>`).join('')
        || '<li class="ayuda">Este curso no tiene lista de materiales.</li>';
      document.getElementById('ir-calculadora').href = '/calculadora.html?curso=' + id;

      if (usuaria) await cargarProgreso();
      pintarLecciones();
      cargarResenas();
    }

    // Portada, título, precio y el botón (o aviso) según quién mira la página
    function pintarCabeceraCurso() {
      let accion = '';
      if (!usuaria) {
        accion = '<p><a href="/login.html">Entra</a> o <a href="/registro.html">regístrate</a> para inscribirte.</p>';
      } else if (usuaria.perfil === 'administradora') {
        accion = '<p class="ayuda">Eres la administradora: este curso se edita desde el <a href="/admin.html">Panel</a>.</p>';
      } else if (!PUEDEN_INSCRIBIRSE.includes(usuaria.perfil)) {
        accion = '<p class="ayuda">Los cursos son para alumnas y profesionales.</p>';
      } else if (!inscrita) {
        accion = `<button class="boton" id="inscribirse" style="margin-top:10px">
          ${Number(curso.precio) > 0 ? 'Inscribirme · ' + precioTexto(curso.precio) : 'Inscribirme gratis'}</button>`;
      }
      document.getElementById('curso').innerHTML = `
        ${curso.imagen ? `<img src="${curso.imagen}" alt="" class="portada">` : ''}
        <span class="etiqueta">${esc(curso.categoria)}</span>
        <h1>${esc(curso.titulo)}</h1>
        <p>${esc(curso.descripcion)}</p>
        <p class="precio">${precioTexto(curso.precio)}</p>
        ${accion}`;
      const btn = document.getElementById('inscribirse');
      if (btn) btn.onclick = alPulsarInscribirme;

      // "Calcular mi precio con estos materiales": para quien está inscrita (y la administradora,
      // que también usa la calculadora). Sin materiales, el botón no tendría nada que cargar.
      const puedeCalcular = inscrita || (usuaria && usuaria.perfil === 'administradora');
      document.getElementById('ir-calculadora').classList.toggle('oculto', !puedeCalcular || curso.materiales.length === 0);
    }

    // Lecciones: 🔒 si no está inscrita, ✅ si ya la ha hecho
    function pintarLecciones() {
      const puedeVer = inscrita || (usuaria && usuaria.perfil === 'administradora');
      document.getElementById('lecciones').innerHTML = curso.lecciones.map(l => {
        if (!puedeVer) return `<li class="bloqueada">🔒 ${esc(l.titulo)}</li>`;
        const hecha = completadas.includes(l.id) ? ' ✅' : '';
        return `<li><a href="/leccion.html?id=${l.id}">${esc(l.titulo)}</a>${hecha}</li>`;
      }).join('') || '<li class="ayuda">Este curso todavía no tiene lecciones.</li>';
    }

    // Gratis → se inscribe directamente. De pago → primero el resumen del pago simulado.
    async function alPulsarInscribirme() {
      document.getElementById('error').classList.add('oculto');
      if (Number(curso.precio) === 0) return inscribirse({});
      document.getElementById('pago-curso').textContent = curso.titulo;
      document.getElementById('pago-total').textContent = precioTexto(curso.precio);
      document.getElementById('pagar').textContent = `Pagar ${precioTexto(curso.precio)} (simulado)`;
      document.getElementById('resumen-pago').classList.remove('oculto');
      document.getElementById('inscribirse').classList.add('oculto');
    }

    document.getElementById('cancelar-pago').onclick = () => {
      document.getElementById('resumen-pago').classList.add('oculto');
      document.getElementById('inscribirse').classList.remove('oculto');
    };

    document.getElementById('pagar').onclick = () => inscribirse({ pago_simulado: true });

    async function inscribirse(datos) {
      try {
        await api(`/api/cursos/${id}/inscribirse`, { method: 'POST', body: datos });
        document.getElementById('resumen-pago').classList.add('oculto');
        await cargarProgreso();
        pintarLecciones();
      } catch (err) { mostrarError(err.message); }
    }

    async function cargarProgreso() {
      try {
        const p = await api(`/api/cursos/${id}/progreso`);
        inscrita = p.terminado !== null; // null = no hay inscripción
        terminado = p.terminado === true;
        completadas = p.completadas || [];
        pintarCabeceraCurso(); // para quitar el botón "Inscribirme" si ya lo está
        if (!inscrita) return;
        document.getElementById('zona-progreso').classList.remove('oculto');
        document.getElementById('barra').style.width = (p.terminado ? 100 : p.porcentaje) + '%';
        let texto = `${p.hechas} de ${p.total} lecciones (${p.porcentaje}%)`;
        if (p.terminado) {
          // Si se añadieron lecciones después de terminar, el curso SIGUE terminado (decisión del proyecto)
          const nuevas = p.total - p.hechas;
          texto = '¡Curso terminado! 🎉' + (nuevas > 0 ? ` Hay ${nuevas} ${nuevas === 1 ? 'lección nueva' : 'lecciones nuevas'} por si quieres verlas.` : '');
          const cert = document.getElementById('certificado');
          cert.href = '/certificado.html?curso=' + id;
          cert.classList.remove('oculto');
          // (el formulario de reseña lo decide cargarResenas: depende de si ya la ha escrito)
        }
        document.getElementById('texto-progreso').textContent = texto;
      } catch (e) { /* sin sesión: no se muestra el progreso */ }
    }

    // ================= Reseñas =================
    const esAdmin = () => usuaria && usuaria.perfil === 'administradora';
    const esMia = (r) => usuaria && r.usuaria_id === usuaria.id;

    // Aviso encima de las reseñas (rojo si es error). Sustituye al alert().
    function avisarResenas(texto, esError = false) {
      const p = document.getElementById('msg-resenas');
      p.textContent = texto;
      p.classList.toggle('error', esError);
      p.classList.toggle('oculto', !texto);
      if (texto) p.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 3 → "★★★☆☆" (las llenas en dorado, las vacías en gris, con CSS)
    function estrellasTexto(n) {
      return `<span class="estrellas" aria-label="${n} de 5 estrellas">${'★'.repeat(n)}<span class="vacias">${'★'.repeat(5 - n)}</span></span>`;
    }

    // --- Elegir estrellas en el formulario ---
    const NOMBRES_ESTRELLAS = ['', 'Muy mal', 'Regular', 'Bien', 'Muy bien', '¡Excelente!'];
    function pintarEleccion(valor) {
      document.querySelector('#form-resena [name=estrellas]').value = valor || '';
      document.querySelectorAll('#elegir-estrellas button').forEach(b =>
        b.classList.toggle('llena', Number(b.dataset.valor) <= valor));
      document.getElementById('texto-estrellas').textContent = valor ? NOMBRES_ESTRELLAS[valor] : 'Pulsa una estrella';
    }
    document.querySelectorAll('#elegir-estrellas button').forEach(b =>
      b.onclick = () => pintarEleccion(Number(b.dataset.valor)));

    // --- Una tarjeta de reseña ---
    function tarjetaResena(r) {
      const respuesta = r.respuesta_admin
        ? `<div class="mensaje" style="margin-top:8px"><strong>🎓 La directora académica responde:</strong> ${esc(r.respuesta_admin)}</div>` : '';
      // La directora: responder o editar su respuesta (en la propia página, decisión del proyecto)
      const controlesAdmin = esAdmin() ? `
        <div class="fila" style="margin-top:8px">
          <button class="chip" onclick="abrirRespuesta(${r.id})">${r.respuesta_admin ? '✏️ Editar respuesta' : '💬 Responder'}</button>
        </div>
        <form class="form-respuesta oculto" id="responder-${r.id}" onsubmit="guardarRespuesta(event, ${r.id})">
          <textarea name="respuesta" rows="2" maxlength="1000" required placeholder="Escribe tu respuesta…">${esc(r.respuesta_admin || '')}</textarea>
          <div class="fila" style="margin-top:6px">
            <button class="boton">Guardar respuesta</button>
            <button type="button" class="chip" onclick="abrirRespuesta(${r.id})">Cancelar</button>
          </div>
        </form>` : '';
      // La autora borra la suya; las demás (con sesión) pueden reportarla. La directora responde, no reporta.
      let acciones = '';
      if (esMia(r)) acciones = `<div class="fila" style="margin-top:8px"><button class="chip peligro" onclick="borrarResena(this, ${r.id})">🗑 Borrar mi reseña</button></div>`;
      else if (usuaria && !esAdmin()) acciones = `<div class="fila" style="margin-top:8px"><button class="chip" onclick="reportarResena(this, ${r.id})">⚑ Reportar</button></div>`;

      return `
        <div class="tarjeta ${esMia(r) ? 'destacada' : ''}" style="margin-bottom:10px">
          <span class="etiqueta">🎓 ${esc(r.insignia)}</span>
          <p style="margin:6px 0 0"><strong>${esc(r.nombre)}</strong>${esMia(r) ? ' <span class="ayuda" style="display:inline">(tu reseña)</span>' : ''}
            · ${estrellasTexto(r.estrellas)}</p>
          <p class="ayuda">${fechaCorta(r.fecha)}</p>
          ${r.comentario ? `<p style="margin:6px 0">${esc(r.comentario)}</p>` : ''}
          ${r.foto ? `<a href="${r.foto}" target="_blank" title="Ver la foto en grande"><img src="${r.foto}" alt="Foto de la reseña" style="max-width:200px"></a>` : ''}
          ${respuesta}${controlesAdmin}${acciones}
        </div>`;
    }

    async function cargarResenas() {
      let resenas;
      try {
        resenas = await api('/api/resenas?curso=' + id);
      } catch (err) {
        return avisarResenas('No se pudieron cargar las reseñas: ' + err.message, true);
      }

      // Media: "★ 4,5 · 3 reseñas"
      const media = resenas.length ? resenas.reduce((s, r) => s + r.estrellas, 0) / resenas.length : 0;
      document.getElementById('media').innerHTML = resenas.length
        ? `<span class="estrellas">★</span> <strong>${media.toLocaleString('es-ES', { maximumFractionDigits: 1 })}</strong>
           · ${resenas.length} ${resenas.length === 1 ? 'reseña' : 'reseñas'}` : '';

      // Formulario: con el curso terminado y sin reseña suya todavía (RN-18 y RN-19)
      const puedeResenar = terminado && PUEDEN_INSCRIBIRSE.includes(usuaria?.perfil) && !resenas.some(esMia);
      document.getElementById('form-resena').classList.toggle('oculto', !puedeResenar);
      if (puedeResenar) {
        document.getElementById('ayuda-resena').textContent =
          `Tu reseña llevará la etiqueta «${usuaria.perfil === 'profesional' ? 'Profesional' : 'Alumna'} certificada». Podrás borrarla, pero no editarla.`;
      }

      document.getElementById('resenas').innerHTML = resenas.map(tarjetaResena).join('')
        || `<p class="ayuda">Todavía no hay reseñas.${terminado ? ' ¡Sé la primera en contar qué te pareció!' : ''}</p>`;

      // Desde la 🔔 (curso.html?id=1#resenas): bajamos a las reseñas una sola vez,
      // cuando ya están pintadas (el navegador no puede hacerlo solo porque llegan después)
      if (location.hash === '#resenas' && !yaBajeAResenas) {
        yaBajeAResenas = true;
        document.getElementById('media').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
    let yaBajeAResenas = false;

    // --- Publicar ---
    document.getElementById('form-resena').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.estrellas.value) return avisarResenas('Elige de 1 a 5 estrellas', true);
      const boton = document.getElementById('publicar-resena');
      boton.disabled = true; // evita publicar dos veces con doble clic
      const datos = new FormData(form);
      datos.append('curso_id', id);
      try {
        await api('/api/resenas', { method: 'POST', body: datos });
        form.reset();
        pintarEleccion(0);
        avisarResenas('✅ ¡Gracias! Tu reseña ya está publicada.');
        cargarResenas();
      } catch (err) {
        avisarResenas(err.message, true); // ej. "Ya has reseñado este curso"
      } finally {
        boton.disabled = false;
      }
    };

    // --- La autora borra su reseña ---
    async function borrarResena(boton, resenaId) {
      if (!confirm('¿Borrar tu reseña? Se borra del todo (también la foto) y no se puede deshacer.')) return;
      boton.disabled = true;
      try {
        await api('/api/resenas/' + resenaId, { method: 'DELETE' });
        avisarResenas('✅ Reseña borrada. Si quieres, puedes escribir una nueva.');
        cargarResenas();
      } catch (err) {
        avisarResenas(err.message, true);
        boton.disabled = false;
      }
    }

    // --- Reportar (menú de motivos compartido, en api.js) ---
    function reportarResena(boton, resenaId) {
      abrirReporte(boton, 'resena', resenaId, (mensaje) => {
        avisarResenas('✅ ' + mensaje);
        cargarResenas(); // la reseña reportada desaparece hasta que se revise
      });
    }

    // --- La directora responde o edita su respuesta ---
    function abrirRespuesta(resenaId) {
      const form = document.getElementById('responder-' + resenaId);
      form.classList.toggle('oculto');
      if (!form.classList.contains('oculto')) form.respuesta.focus();
    }

    async function guardarRespuesta(e, resenaId) {
      e.preventDefault();
      const form = e.target;
      const boton = form.querySelector('button.boton');
      boton.disabled = true;
      try {
        await api(`/api/resenas/${resenaId}/responder`, { method: 'PUT', body: { respuesta: form.respuesta.value } });
        avisarResenas('✅ Respuesta guardada.');
        cargarResenas();
        actualizarCampana(); // si era de 1-3 ⭐, sale de la 🔔
      } catch (err) {
        avisarResenas(err.message, true);
        boton.disabled = false;
      }
    }

    iniciar();
  </script>
</body>
</html>
