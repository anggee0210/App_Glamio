<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <h1>Muro de trabajos</h1>

    <form id="form" class="tarjeta oculto" style="margin-bottom:16px">
      <h2 style="margin-top:0">Publicar mi resultado</h2>
      <label>Foto <input type="file" name="foto" accept="image/*" required></label>
      <label>Curso <select name="curso_id" id="curso"><option value="">Sin curso</option></select></label>
      <label>Descripción <textarea name="descripcion" rows="2"></textarea></label>
      <label class="fila"><input type="checkbox" name="permiso_mi_estilo" style="width:auto">
        Doy permiso para que las clientas vean esta foto (muro de clientas y, más adelante, Mi Estilo)</label>
      <button class="boton">Publicar</button>
    </form>

    <div class="filtros" id="filtros"></div>
    <div class="rejilla" id="trabajos"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    let usuaria = null;

    // Etiqueta para saber si las clientas ven la foto. Solo la ve quien ve todo el muro:
    // a la clienta ya le llegan solo las fotos con permiso, así que para ella no hace falta.
    function etiquetaPermiso(t) {
      if (!usuaria || usuaria.perfil === 'clienta') return '';
      return t.permiso_mi_estilo
        ? '<span class="etiqueta">👁 Visible para clientas</span>'
        : '<span class="etiqueta gris">🔒 Solo la comunidad</span>';
    }

    async function cargarTrabajos(categoria = '') {
      const trabajos = await api('/api/trabajos' + (categoria ? '?categoria=' + categoria : ''));
      document.getElementById('trabajos').innerHTML = trabajos.map(t => `
        <div class="tarjeta">
          <img src="${t.foto}" alt="">
          ${t.curso ? `<span class="etiqueta">${esc(t.curso)}</span>` : ''}
          ${etiquetaPermiso(t)}
          <p><strong>${esc(t.nombre)}</strong> ${esc(t.descripcion)}</p>
          <button class="chip" onclick="reportar(${t.id})">Reportar</button>
        </div>`).join('') || '<p>Todavía no hay trabajos publicados.</p>';
    }

    async function reportar(id) {
      const motivo = prompt('¿Por qué lo reportas?');
      if (motivo === null) return;
      await api('/api/reportes', { method: 'POST', body: { tipo: 'trabajo', elemento_id: id, motivo } });
      cargarTrabajos();
    }

    async function iniciar() {
      usuaria = await pintarCabecera();
      // Solo publican quienes hacen los trabajos (el servidor también lo comprueba)
      if (usuaria && ['alumna', 'profesional'].includes(usuaria.perfil)) {
        document.getElementById('form').classList.remove('oculto');
        const cursos = await api('/api/cursos');
        document.getElementById('curso').innerHTML += cursos.map(c => `<option value="${c.id}">${esc(c.titulo)}</option>`).join('');
      }
      pintarFiltros(document.getElementById('filtros'), cargarTrabajos);
      cargarTrabajos();
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/trabajos', { method: 'POST', body: new FormData(e.target) });
        e.target.reset();
        cargarTrabajos();
      } catch (err) { alert(err.message); }
    };

    iniciar();
  </script>
</body>
</html>
