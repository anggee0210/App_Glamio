<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lección – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <div id="leccion"></div>
    <button class="boton oculto" id="completar" style="margin:12px 0">Marcar como completada ✔</button>
    <p class="mensaje oculto" id="msg"></p>
    <!-- "← Anterior · Lección 2 de 5 · Siguiente →" -->
    <nav class="navegacion" id="navegacion"></nav>

    <h2>Dudas de esta lección</h2>
    <form id="form-duda" class="tarjeta">
      <textarea name="texto" rows="2" placeholder="Escribe tu duda..." required></textarea>
      <label>Foto (opcional) <input type="file" name="foto" accept="image/*"></label>
      <button class="boton">Preguntar</button>
    </form>
    <div id="dudas" style="margin-top:12px"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const id = param('id');
    let usuaria = null;

    // Convierte un enlace de YouTube normal al formato embed
    function enlaceEmbed(url) {
      const m = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
      return m ? 'https://www.youtube.com/embed/' + m[1] : url;
    }

    let leccion = null;
    let siguiente = null; // la lección que va después (para el botón "Siguiente →")

    async function iniciar() {
      usuaria = await pintarCabecera();
      try {
        leccion = await api('/api/lecciones/' + id);
      } catch (err) {
        document.querySelector('main').innerHTML =
          `<p class="mensaje">${esc(err.message)}</p><a href="/index.html">← Ver los cursos</a>`;
        return;
      }
      const l = leccion;
      let video = '';
      if (l.video_local) video = `<div class="video"><video src="${l.video_local}" controls></video></div>`;
      else if (l.video_url) video = `<div class="video"><iframe src="${enlaceEmbed(l.video_url)}" allowfullscreen></iframe></div>`;
      document.getElementById('leccion').innerHTML = `
        <a href="/curso.html?id=${l.curso_id}">← Volver al curso</a>
        <h1>${esc(l.titulo)}</h1>${video}<p style="margin-top:10px">${esc(l.contenido)}</p>`;
      pintarBoton(l.completada);
      await cargarNavegacion();
      cargarDudas();
    }

    // El botón solo sale a quien está inscrita (la admin puede ver la lección, pero no completarla)
    function pintarBoton(completada) {
      const boton = document.getElementById('completar');
      if (!leccion.inscrita) return boton.classList.add('oculto');
      boton.classList.remove('oculto');
      boton.disabled = completada;
      boton.classList.toggle('secundario', completada);
      boton.textContent = completada ? '✅ Lección completada' : 'Marcar como completada ✔';
    }

    // "← Anterior · Lección 2 de 5 · Siguiente →" usando las lecciones del curso en orden
    async function cargarNavegacion() {
      const curso = await api('/api/cursos/' + leccion.curso_id);
      const lista = curso.lecciones;
      const pos = lista.findIndex(x => x.id === leccion.id);
      const anterior = lista[pos - 1];
      siguiente = lista[pos + 1] || null;
      document.getElementById('navegacion').innerHTML = `
        ${anterior ? `<a class="chip" href="/leccion.html?id=${anterior.id}">← Anterior</a>` : '<span></span>'}
        <span class="ayuda">Lección ${pos + 1} de ${lista.length}</span>
        ${siguiente ? `<a class="chip" href="/leccion.html?id=${siguiente.id}">Siguiente →</a>` : '<span></span>'}`;
    }

    document.getElementById('completar').onclick = async () => {
      const msg = document.getElementById('msg');
      try {
        const r = await api(`/api/lecciones/${id}/completar`, { method: 'POST' });
        pintarBoton(true);
        if (r.terminado) {
          msg.innerHTML = `¡Curso terminado! 🎉 Ya puedes dejar tu reseña.
            <a class="boton" style="display:inline-block;margin-top:8px" href="/certificado.html?curso=${leccion.curso_id}">Ver mi certificado</a>`;
        } else {
          msg.innerHTML = `Llevas ${r.hechas} de ${r.total} lecciones.` +
            (siguiente ? ` <a href="/leccion.html?id=${siguiente.id}">Ir a la siguiente →</a>` : '');
        }
        msg.classList.remove('error');
      } catch (err) {
        msg.textContent = err.message; // p. ej. "Inscríbete en el curso para marcar sus lecciones"
        msg.classList.add('error');
      }
      msg.classList.remove('oculto');
    };

    async function cargarDudas() {
      const dudas = await api('/api/dudas?leccion=' + id);
      const esAdmin = usuaria && usuaria.perfil === 'administradora';
      document.getElementById('dudas').innerHTML = dudas.map(d => `
        <div class="tarjeta" style="margin-bottom:10px">
          <p><strong>${esc(d.nombre)}:</strong> ${esc(d.texto)}</p>
          ${d.foto ? `<img src="${d.foto}" alt="" style="max-width:220px">` : ''}
          ${d.respuestas.map(r => `
            <div class="tarjeta ${r.destacada ? 'destacada' : ''}" style="margin-top:8px">
              ${r.destacada ? '<span class="etiqueta">⭐ Respuesta destacada</span>' : ''}
              <p><strong>${esc(r.nombre)}:</strong> ${esc(r.texto)}</p>
              <div class="fila">
                ${esAdmin && !r.destacada ? `<button class="chip" onclick="destacar(${r.id})">Destacar</button>` : ''}
                <button class="chip" onclick="reportar('respuesta', ${r.id})">Reportar</button>
              </div>
            </div>`).join('')}
          <form class="fila" style="flex-direction:row;margin-top:8px" onsubmit="responder(event, ${d.id})">
            <input name="texto" placeholder="Responder..." required>
            <button class="boton">Enviar</button>
          </form>
          <button class="chip" style="margin-top:6px" onclick="reportar('duda', ${d.id})">Reportar</button>
        </div>`).join('') || '<p>Nadie ha preguntado todavía.</p>';
    }

    document.getElementById('form-duda').onsubmit = async (e) => {
      e.preventDefault();
      const datos = new FormData(e.target);
      datos.append('leccion_id', id);
      await api('/api/dudas', { method: 'POST', body: datos });
      e.target.reset();
      cargarDudas();
    };

    async function responder(e, dudaId) {
      e.preventDefault();
      await api(`/api/dudas/${dudaId}/respuestas`, { method: 'POST', body: { texto: e.target.texto.value } });
      cargarDudas();
    }

    async function destacar(respuestaId) {
      await api(`/api/dudas/respuestas/${respuestaId}/destacar`, { method: 'PUT' });
      cargarDudas();
    }

    async function reportar(tipo, elementoId) {
      const motivo = prompt('¿Por qué lo reportas?');
      if (motivo === null) return;
      await api('/api/reportes', { method: 'POST', body: { tipo, elemento_id: elementoId, motivo } });
      cargarDudas();
    }

    iniciar();
  </script>
</body>
</html>
