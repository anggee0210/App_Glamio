<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lección – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <div id="leccion"></div>
    <button class="boton oculto" id="completar" style="margin:12px 0">Marcar como completada ✔</button>
    <p class="mensaje oculto" id="msg"></p>
    <!-- "← Anterior · Lección 2 de 5 · Siguiente →" -->
    <nav class="navegacion" id="navegacion"></nav>

    <h2>Dudas de esta lección</h2>
    <form id="form-duda" class="tarjeta">
      <textarea name="texto" rows="2" placeholder="Escribe tu duda..." required maxlength="1000"></textarea>
      <label>Foto (opcional) <input type="file" name="foto" accept="image/*"></label>
      <button class="boton">Preguntar</button>
    </form>
    <p class="mensaje error oculto" id="error-dudas"></p>
    <div id="dudas" style="margin-top:12px"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const id = param('id');
    let usuaria = null;

    // Convierte un enlace de YouTube normal al formato embed
    function enlaceEmbed(url) {
      const m = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
      return m ? 'https://www.youtube.com/embed/' + m[1] : url;
    }

    let leccion = null;
    let siguiente = null; // la lección que va después (para el botón "Siguiente →")

    async function iniciar() {
      usuaria = await pintarCabecera();
      try {
        leccion = await api('/api/lecciones/' + id);
      } catch (err) {
        document.querySelector('main').innerHTML =
          `<p class="mensaje">${esc(err.message)}</p><a href="/index.html">← Ver los cursos</a>`;
        return;
      }
      const l = leccion;
      let video = '';
      if (l.video_local) video = `<div class="video"><video src="${l.video_local}" controls></video></div>`;
      else if (l.video_url) video = `<div class="video"><iframe src="${enlaceEmbed(l.video_url)}" allowfullscreen></iframe></div>`;
      document.getElementById('leccion').innerHTML = `
        <a href="/curso.html?id=${l.curso_id}">← Volver al curso</a>
        <h1>${esc(l.titulo)}</h1>${video}<p style="margin-top:10px">${esc(l.contenido)}</p>`;
      pintarBoton(l.completada);
      await cargarNavegacion();
      cargarDudas();
    }

    // El botón solo sale a quien está inscrita (la admin puede ver la lección, pero no completarla)
    function pintarBoton(completada) {
      const boton = document.getElementById('completar');
      if (!leccion.inscrita) return boton.classList.add('oculto');
      boton.classList.remove('oculto');
      boton.disabled = completada;
      boton.classList.toggle('secundario', completada);
      boton.textContent = completada ? '✅ Lección completada' : 'Marcar como completada ✔';
    }

    // "← Anterior · Lección 2 de 5 · Siguiente →" usando las lecciones del curso en orden
    async function cargarNavegacion() {
      const curso = await api('/api/cursos/' + leccion.curso_id);
      const lista = curso.lecciones;
      const pos = lista.findIndex(x => x.id === leccion.id);
      const anterior = lista[pos - 1];
      siguiente = lista[pos + 1] || null;
      document.getElementById('navegacion').innerHTML = `
        ${anterior ? `<a class="chip" href="/leccion.html?id=${anterior.id}">← Anterior</a>` : '<span></span>'}
        <span class="ayuda">Lección ${pos + 1} de ${lista.length}</span>
        ${siguiente ? `<a class="chip" href="/leccion.html?id=${siguiente.id}">Siguiente →</a>` : '<span></span>'}`;
    }

    document.getElementById('completar').onclick = async () => {
      const msg = document.getElementById('msg');
      try {
        const r = await api(`/api/lecciones/${id}/completar`, { method: 'POST' });
        pintarBoton(true);
        if (r.terminado) {
          msg.innerHTML = `¡Curso terminado! 🎉 Ya puedes dejar tu reseña.
            <a class="boton" style="display:inline-block;margin-top:8px" href="/certificado.html?curso=${leccion.curso_id}">Ver mi certificado</a>`;
        } else {
          msg.innerHTML = `Llevas ${r.hechas} de ${r.total} lecciones.` +
            (siguiente ? ` <a href="/leccion.html?id=${siguiente.id}">Ir a la siguiente →</a>` : '');
        }
        msg.classList.remove('error');
      } catch (err) {
        msg.textContent = err.message; // p. ej. "Inscríbete en el curso para marcar sus lecciones"
        msg.classList.add('error');
      }
      msg.classList.remove('oculto');
    };

    // (fechaCorta() está en api.js: la usan varias páginas)

    // Nombre + etiqueta del perfil + fecha. La directora académica se distingue
    // para que la alumna sepa qué respuesta viene de la academia.
    function autoria(x) {
      const etiqueta = x.perfil === 'administradora' ? ' <span class="etiqueta">🎓 Directora académica</span>'
        : x.perfil === 'profesional' ? ' <span class="etiqueta gris">Profesional</span>' : '';
      return `<strong>${esc(x.nombre)}</strong>${etiqueta} <span class="ayuda" style="display:inline">· ${fechaCorta(x.fecha)}</span>`;
    }

    // Aviso encima de las dudas: rojo si es un error, rosa si es una confirmación
    function mostrarErrorDudas(texto, esError = true) {
      const p = document.getElementById('error-dudas');
      p.textContent = texto;
      p.classList.toggle('oculto', !texto);
      p.classList.toggle('error', esError);
      // Si el error viene de una duda de más abajo, llevamos la vista hasta el aviso
      if (texto) p.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function cargarDudas() {
      let dudas;
      try {
        dudas = await api('/api/dudas?leccion=' + id);
      } catch (err) {
        mostrarErrorDudas('No se pudieron cargar las dudas: ' + err.message);
        return;
      }
      const esAdmin = usuaria && usuaria.perfil === 'administradora';
      document.getElementById('dudas').innerHTML = dudas.map(d => `
        <div class="tarjeta" id="duda-${d.id}" style="margin-bottom:10px">
          <p style="margin:0">${autoria(d)}</p>
          <p style="margin:6px 0">${esc(d.texto)}</p>
          ${d.foto ? `<a href="${d.foto}" target="_blank" title="Ver la foto en grande"><img src="${d.foto}" alt="Foto de la duda" style="max-width:220px"></a>` : ''}
          ${d.respuestas.length ? '' : '<p class="ayuda" style="margin-top:8px">Aún sin respuestas. ¿Sabes la solución? ¡Ayuda a tu compañera!</p>'}
          ${d.respuestas.map(r => `
            <div class="tarjeta ${r.destacada ? 'destacada' : ''}" style="margin-top:8px">
              ${r.destacada ? '<span class="etiqueta">⭐ Respuesta destacada</span>' : ''}
              <p style="margin:4px 0 0">${autoria(r)}</p>
              <p style="margin:6px 0">${esc(r.texto)}</p>
              <div class="fila">
                ${esAdmin && !r.destacada ? `<button class="chip" onclick="destacar(${r.id})">⭐ Destacar</button>` : ''}
                ${esAdmin && r.destacada ? `<button class="chip peligro" onclick="quitarDestacada(${r.id})">Quitar destacada</button>` : ''}
                ${puedeReportar(r) ? `<button class="chip" onclick="reportar(this, 'respuesta', ${r.id})">⚑ Reportar</button>` : ''}
              </div>
            </div>`).join('')}
          <form class="fila" style="flex-direction:row;margin-top:8px" onsubmit="responder(event, ${d.id})">
            <input name="texto" placeholder="Responder..." required maxlength="1000">
            <button class="boton">Enviar</button>
          </form>
          ${puedeReportar(d) ? `<div class="fila" style="margin-top:6px"><button class="chip" onclick="reportar(this, 'duda', ${d.id})">⚑ Reportar duda</button></div>` : ''}
        </div>`).join('') || '<p class="ayuda">Nadie ha preguntado todavía. ¡Sé la primera!</p>';

      // Si venimos de la campana (…#duda-5), bajamos hasta esa duda. El navegador no lo hace
      // solo porque las dudas llegan DESPUÉS de cargar la página. (Solo la primera vez.)
      if (location.hash && !yaBajeALaDuda) {
        yaBajeALaDuda = true;
        const destino = document.querySelector(location.hash);
        if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      // 🔔 La alumna ya está viendo las respuestas a sus dudas de esta lección:
      // las marcamos como vistas y la campana del menú se actualiza.
      if (usuaria && ['alumna', 'profesional'].includes(usuaria.perfil)) {
        api('/api/dudas/mis-avisos/leidos', { method: 'PUT', body: { leccion_id: Number(id) } })
          .then(actualizarCampana)
          .catch(() => {}); // si falla, solo significa que el aviso sigue en la campana
      }
    }
    let yaBajeALaDuda = false;

    // Envía un formulario sin que el doble clic lo mande dos veces:
    // el botón se desactiva mientras espera al servidor y se reactiva al terminar.
    async function enviarSinRepetir(formulario, accion) {
      const boton = formulario.querySelector('button');
      boton.disabled = true;
      try {
        await accion();
        mostrarErrorDudas('');
        return true;
      } catch (err) {
        mostrarErrorDudas(err.message); // ej. "Escribe tu duda" o "La foto de la duda tiene que ser una imagen"
        return false;
      } finally {
        boton.disabled = false;
      }
    }

    document.getElementById('form-duda').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const datos = new FormData(form);
      datos.append('leccion_id', id);
      const bien = await enviarSinRepetir(form, () => api('/api/dudas', { method: 'POST', body: datos }));
      if (bien) { form.reset(); cargarDudas(); }
    };

    async function responder(e, dudaId) {
      e.preventDefault();
      const form = e.target;
      const bien = await enviarSinRepetir(form, () =>
        api(`/api/dudas/${dudaId}/respuestas`, { method: 'POST', body: { texto: form.texto.value } }));
      if (bien) cargarDudas(); // si falla, no recargamos: así no se pierde lo escrito
    }

    // Destacar y quitar usan la misma dirección: PUT pone la estrella, DELETE la quita
    async function destacar(respuestaId) {
      await cambiarDestacada(respuestaId, 'PUT');
    }

    async function quitarDestacada(respuestaId) {
      if (!confirm('¿Quitar la estrella de esta respuesta? La duda se quedará sin respuesta destacada.')) return;
      await cambiarDestacada(respuestaId, 'DELETE');
    }

    async function cambiarDestacada(respuestaId, metodo) {
      try {
        await api(`/api/dudas/respuestas/${respuestaId}/destacar`, { method: metodo });
        mostrarErrorDudas('');
      } catch (err) {
        mostrarErrorDudas(err.message); // ej. "Esa respuesta no estaba destacada"
      }
      cargarDudas();
    }

    // Lo propio no se reporta (el servidor tampoco lo deja): para eso no sale el botón
    function puedeReportar(x) {
      return usuaria && x.usuaria_id !== usuaria.id;
    }

    // Abre el menú de motivos (abrirReporte está en api.js, lo comparte con el muro)
    function reportar(boton, tipo, elementoId) {
      abrirReporte(boton, tipo, elementoId, (mensaje) => {
        mostrarErrorDudas('✅ ' + mensaje, false); // confirmación en rosa, no en rojo
        cargarDudas(); // lo reportado desaparece de la lista
      });
    }

    iniciar();
  </script>
</body>
</html>
