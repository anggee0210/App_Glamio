<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main style="max-width:420px">
    <h1>Crear cuenta</h1>
    <form id="form">
      <label>Nombre <input name="nombre" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Contraseña <input type="password" name="password" minlength="6" required></label>
      <label>Soy...
        <select name="perfil">
          <option value="alumna">Alumna – quiero aprender</option>
          <option value="profesional">Profesional – ya trabajo en belleza</option>
          <option value="clienta">Clienta – busco ideas y profesionales</option>
        </select>
      </label>
      <button class="boton">Registrarme</button>
    </form>
    <p class="mensaje oculto" id="msg"></p>
  </main>
  <script src="/js/api.js"></script>
  <script>
    pintarCabecera();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const usuaria = await api('/api/auth/registro', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
        location.href = paginaInicio(usuaria); // la clienta va al muro, el resto a los cursos
      } catch (err) {
        const msg = document.getElementById('msg');
        msg.textContent = err.message; msg.classList.remove('oculto');
      }
    };
  </script>
</body>
</html>
