<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular mi precio – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main style="max-width:560px">
    <h1>Calcular mi precio</h1>
    <form id="form">
      <label>Nombre del servicio <input name="nombre" required placeholder="Ej: Semipermanente manos"></label>
      <label>Categoría <select name="categoria_id" id="categoria"></select></label>

      <h2>Materiales (coste por servicio)</h2>
      <div id="materiales"></div>
      <button type="button" class="boton secundario" id="anadir">+ Añadir material</button>

      <h2>Tiempo y margen</h2>
      <label>Minutos que tardas <input type="number" name="minutos" value="60" min="1"></label>
      <label>Cuánto quieres ganar por hora (€) <input type="number" name="precio_hora" value="12" step="0.5"></label>
      <label>Margen (%) <input type="number" name="margen" value="30"></label>

      <div class="tarjeta destacada"><h2 style="margin:0">Precio sugerido: <span id="resultado">0 €</span></h2></div>
      <button class="boton">Guardar servicio</button>
    </form>

    <h2>Mis servicios</h2>
    <div id="servicios"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('form');
    const cursoId = param('curso');

    function filaMaterial(nombre = '', coste = '') {
      const div = document.createElement('div');
      div.className = 'fila';
      div.style.marginBottom = '6px';
      div.innerHTML = `<input class="m-nombre" placeholder="Material" value="${esc(nombre)}">
        <input class="m-coste" type="number" step="0.01" placeholder="€" value="${coste}" style="max-width:90px">
        <button type="button" class="chip">✕</button>`;
      div.querySelector('button').onclick = () => { div.remove(); calcular(); };
      document.getElementById('materiales').appendChild(div);
    }

    function leerDatos() {
      const datos = Object.fromEntries(new FormData(form));
      datos.curso_id = cursoId;
      datos.materiales = [...document.querySelectorAll('#materiales .fila')].map(f => ({
        nombre: f.querySelector('.m-nombre').value,
        coste: Number(f.querySelector('.m-coste').value || 0)
      })).filter(m => m.nombre);
      return datos;
    }

    async function calcular() {
      const r = await api('/api/servicios/calcular', { method: 'POST', body: leerDatos() });
      document.getElementById('resultado').textContent = r.precio_sugerido.toFixed(2) + ' €';
    }

    async function cargarServicios() {
      try {
        const servicios = await api('/api/servicios');
        document.getElementById('servicios').innerHTML = servicios.map(s => `
          <div class="tarjeta" style="margin-bottom:8px">
            <strong>${esc(s.nombre)}</strong> – ${s.precio_sugerido} €
            <small>(${s.minutos} min · ${s.materiales.length} materiales)</small>
          </div>`).join('') || '<p>Aún no has guardado servicios.</p>';
      } catch (e) {
        document.getElementById('servicios').innerHTML = '<p><a href="/login.html">Entra</a> para guardar tus servicios.</p>';
      }
    }

    async function iniciar() {
      await pintarCabecera();
      const categorias = await api('/api/categorias');
      document.getElementById('categoria').innerHTML = categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

      // Si venimos de un curso, cargamos sus materiales
      if (cursoId) {
        const curso = await api('/api/cursos/' + cursoId);
        form.nombre.value = curso.titulo;
        form.categoria_id.value = curso.categoria_id;
        curso.materiales.forEach(m => filaMaterial(m.nombre, ''));
      } else {
        filaMaterial();
      }
      cargarServicios();
    }

    document.getElementById('anadir').onclick = () => filaMaterial();
    form.addEventListener('input', calcular);
    form.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/servicios', { method: 'POST', body: leerDatos() });
        cargarServicios();
      } catch (err) { alert(err.message); }
    };

    iniciar();
  </script>
</body>
</html>
