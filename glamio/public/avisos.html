<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main class="pagina-avisos">
    <!-- Diseño "Panel de avisos": título con campana a la izquierda, "Marcar todo como visto" a la derecha -->
    <div class="avisos-cabecera">
      <div>
        <h1 class="titulo-icono">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span id="titulo">Notificaciones</span>
        </h1>
        <p class="avisos-sub" id="explicacion"></p>
      </div>
      <button class="boton-contorno boton-visto oculto" id="todo-visto">✓ Marcar todo como visto</button>
    </div>
    <p class="mensaje error oculto" id="error"></p>
    <p class="mensaje oculto" id="exito"></p>
    <div id="lista"><p>Cargando…</p></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // (haceCuanto() y fechaCorta() están en api.js)
    const PERFILES = { alumna: 'Alumna', profesional: 'Profesional', administradora: '🎓 Administradora' };
    const ICONO_PERSONA = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
    const ICONOS = {
      dudas: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17" r=".6"/></svg>',
      resenas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
      respuestas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'
    };
    let usuaria = null;

    function etiqueta(perfil) {
      return `<span class="etiqueta etiqueta-perfil">${PERFILES[perfil] || esc(perfil)}</span>`;
    }
    function avisar(id, texto) {
      const p = document.getElementById(id);
      p.textContent = texto;
      p.classList.toggle('oculto', !texto);
    }

    // Una tarjeta del diseño: círculo · datos · botón a la derecha
    function tarjeta({ quien, perfil, extraCabeza = '', donde, texto, pie, boton, href, claseBoton = 'boton-rosa' }) {
      return `
        <div class="aviso">
          <span class="avatar avatar-aviso">${ICONO_PERSONA}</span>
          <div class="aviso-datos">
            <p class="aviso-cabeza"><strong>${esc(quien)}</strong> ${perfil ? etiqueta(perfil) : ''} ${extraCabeza}</p>
            <p class="aviso-donde">${donde}</p>
            ${texto ? `<p class="aviso-texto">«${esc(texto)}»</p>` : ''}
            <p class="ayuda">${pie}</p>
          </div>
          <a class="${claseBoton}" href="${href}">${boton} →</a>
        </div>`;
    }

    // Apartado con franja lila: icono + título (número) + sus tarjetas
    function apartado(icono, titulo, tarjetas) {
      if (!tarjetas.length) return '';
      return `<section class="apartado-avisos">
        <h2 class="franja-avisos">${ICONOS[icono]} ${titulo} (${tarjetas.length})</h2>
        ${tarjetas.join('')}
      </section>`;
    }

    // Administradora: dudas que aún no ha contestado
    const tarjetaDuda = (d) => tarjeta({
      quien: d.nombre, perfil: d.perfil,
      donde: `${esc(d.curso)} › ${esc(d.leccion)}`,
      texto: d.texto + (d.foto ? ' 📷' : ''),
      pie: haceCuanto(d.fecha) + (d.respuestas ? ` · ${d.respuestas} ${d.respuestas === 1 ? 'respuesta' : 'respuestas'} de compañeras` : ''),
      boton: 'Ir a responder', href: `/leccion.html?id=${d.leccion_id}#duda-${d.id}`
    });

    // Administradora: reseñas de 1 a 3 ⭐ sin responder (RN-21: las negativas se responden)
    const tarjetaResena = (r) => tarjeta({
      quien: r.nombre,
      extraCabeza: `<span class="estrellas" aria-label="${r.estrellas} de 5 estrellas">${'★'.repeat(r.estrellas)}<span class="vacias">${'★'.repeat(5 - r.estrellas)}</span></span>`,
      donde: esc(r.curso), texto: r.comentario, pie: haceCuanto(r.fecha),
      boton: 'Responder', href: `/curso.html?id=${r.curso_id}#resenas`
    });

    // Alumna / profesional: respuestas nuevas a sus dudas
    const tarjetaRespuesta = (r) => tarjeta({
      quien: r.nombre, perfil: r.perfil,
      extraCabeza: 'respondió a tu duda' + (r.destacada ? ' <span class="etiqueta etiqueta-destacada">⭐ Destacada</span>' : ''),
      donde: `${esc(r.curso)} › ${esc(r.leccion)}`, texto: r.texto,
      pie: haceCuanto(r.fecha) + ` · Tu duda: «${esc(r.duda)}»`,
      boton: 'Ver en la lección', href: `/leccion.html?id=${r.leccion_id}#duda-${r.duda_id}`, claseBoton: 'boton-lila'
    });

    async function cargar() {
      const esAdmin = usuaria.perfil === 'administradora';
      const lista = document.getElementById('lista');
      let avisos;
      try {
        avisos = await cargarAvisos(usuaria); // cargarAvisos() está en api.js (lo usa también la campana)
      } catch (err) {
        lista.innerHTML = '';
        return avisar('error', err.message);
      }
      const html = esAdmin
        ? apartado('dudas', 'Dudas por responder', avisos.dudas.map(tarjetaDuda)) +
          apartado('resenas', 'Reseñas de 1 a 3 estrellas sin responder', avisos.resenas.map(tarjetaResena))
        : apartado('respuestas', 'Nuevas respuestas a tus dudas', avisos.respuestas.map(tarjetaRespuesta));
      lista.innerHTML = html || `<div class="todo-al-dia"><span aria-hidden="true">🎉</span>
        <strong>¡Todo al día!</strong><span>${esAdmin ? 'No hay dudas ni reseñas pendientes.' : 'No tienes notificaciones nuevas.'}</span></div>`;
      // La administradora no "marca como visto": sus avisos se van solos al responder
      document.getElementById('todo-visto').classList.toggle('oculto', esAdmin || avisos.respuestas.length === 0);
    }

    document.getElementById('todo-visto').onclick = async () => {
      try {
        await api('/api/dudas/mis-avisos/leidos', { method: 'PUT', body: {} });
        avisar('error', '');
        avisar('exito', '✅ Todo marcado como visto.');
        await cargar();
        actualizarCampana();
      } catch (err) { avisar('error', err.message); }
    };

    async function iniciar() {
      usuaria = await pintarCabecera();
      if (!usuaria) {
        document.querySelector('main').innerHTML =
          '<p class="mensaje"><a href="/login.html">Entra</a> para ver tus notificaciones.</p>';
        return;
      }
      const esAdmin = usuaria.perfil === 'administradora';
      document.getElementById('titulo').textContent = 'Notificaciones'; // un solo nombre para todos
      document.title = 'Notificaciones – GLAMIO';
      document.getElementById('explicacion').textContent = esAdmin
        ? 'Revisa las dudas y reseñas pendientes. Al responder, desaparecen solas de esta lista.'
        : 'Aquí te avisamos cuando alguien responde a tus dudas. Al abrir la lección, se marcan como vistas.';
      cargar();
    }

    iniciar();
  </script>
</body>
</html>
