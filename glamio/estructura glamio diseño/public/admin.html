<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administradora – GLAMIO</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera"><a href="/index.html" class="logo">GLAMIO</a><nav class="menu"></nav></header>
  <main>
    <h1>Panel de administradora</h1>

    <h2>Mis cursos</h2>
    <div id="lista-cursos"><p>Cargando…</p></div>

    <section class="tarjeta" style="margin-top:14px">
      <h2 style="margin-top:0">Nuevo curso</h2>
      <form id="form-curso">
        <input name="titulo" placeholder="Título" required>
        <textarea name="descripcion" placeholder="Descripción" rows="2"></textarea>
        <select name="categoria_id" class="sel-categoria"></select>
        <input name="precio" type="number" step="0.01" min="0" placeholder="Precio (0 = gratis)">
        <label>Imagen <input type="file" name="imagen" accept="image/*"></label>
        <p class="ayuda oculto"></p>
        <div class="fila">
          <button class="boton">Crear curso</button>
          <button type="button" class="boton secundario cancelar oculto">Cancelar</button>
        </div>
        <p class="mensaje oculto"></p>
      </form>
    </section>

    <section class="tarjeta" style="margin-top:14px">
      <h2 style="margin-top:0">Nueva lección</h2>
      <form id="form-leccion">
        <select name="curso_id" class="sel-curso"></select>
        <input name="titulo" placeholder="Título" required>
        <label>Orden <input name="orden" type="number" min="1" value="1"></label>
        <input name="video_url" placeholder="Enlace de YouTube (videos largos)">
        <label>o video corto propio (máx. 50 MB) <input type="file" name="video" accept="video/*"></label>
        <p class="ayuda oculto"></p>
        <textarea name="contenido" placeholder="Texto de la lección" rows="3"></textarea>
        <div class="fila">
          <button class="boton">Crear lección</button>
          <button type="button" class="boton secundario cancelar oculto">Cancelar</button>
        </div>
        <p class="mensaje oculto"></p>
      </form>
    </section>

    <section class="tarjeta" style="margin-top:14px">
      <h2 style="margin-top:0">Material de un curso</h2>
      <form id="form-material">
        <select name="curso_id" class="sel-curso"></select>
        <input name="nombre" placeholder="Material" required>
        <input name="cantidad" placeholder="Cantidad">
        <div class="fila">
          <button class="boton">Añadir material</button>
          <button type="button" class="boton secundario cancelar oculto">Cancelar</button>
        </div>
        <p class="mensaje oculto"></p>
      </form>
    </section>

    <section class="tarjeta" style="margin-top:14px">
      <h2 style="margin-top:0">Nueva categoría</h2>
      <form id="form-categoria">
        <div class="fila">
          <input name="icono" placeholder="🙂" style="max-width:70px">
          <input name="nombre" placeholder="Nombre" required>
          <button class="boton">Añadir</button>
        </div>
        <p class="mensaje oculto"></p>
      </form>
    </section>

    <section class="tarjeta" style="margin-top:14px">
      <h2 style="margin-top:0">Diseño del certificado</h2>
      <form id="form-certificado">
        <label>Imagen de fondo (horizontal, por ejemplo 3508 × 2480 px)
          <input type="file" name="fondo" accept="image/*"></label>
        <div id="cert-fondo-actual" class="ayuda"></div>

        <label>Firma escaneada (opcional, mejor PNG con fondo transparente)
          <input type="file" name="firma" accept="image/*"></label>
        <div id="cert-firma-actual" class="ayuda"></div>

        <input name="directora" placeholder="Nombre de la directora académica">
        <label class="fila">Color del texto
          <input type="color" name="color_texto" value="#3a2f36" style="width:60px;padding:2px"></label>

        <div class="fila">
          <button class="boton">Guardar diseño</button>
          <a class="boton secundario" href="/certificado.html?vista_previa=1" target="_blank">Vista previa</a>
        </div>
        <p class="mensaje oculto"></p>
      </form>
    </section>

    <h2>Reportes pendientes</h2>
    <div id="reportes"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // Aquí guardamos cada curso con sus lecciones y materiales (por id),
    // para rellenar los formularios al pulsar "Editar" sin volver a pedirlos.
    let cursos = {};

    // Textos de cada formulario: [título al crear, título al editar, botón al crear]
    const TEXTOS = {
      'form-curso': ['Nuevo curso', 'Editar curso', 'Crear curso'],
      'form-leccion': ['Nueva lección', 'Editar lección', 'Crear lección'],
      'form-material': ['Material de un curso', 'Editar material', 'Añadir material']
    };
    const formCurso = document.getElementById('form-curso');
    const formLeccion = document.getElementById('form-leccion');
    const formMaterial = document.getElementById('form-material');

    // ---------- Mensajes dentro de cada formulario ----------
    function avisar(form, texto, esError = false) {
      const msg = form.querySelector('.mensaje');
      msg.textContent = texto;
      msg.classList.toggle('error', esError);
      msg.classList.remove('oculto');
    }

    // ---------- Modo crear / modo editar ----------
    // El mismo formulario sirve para las dos cosas: si tiene data-editando="5",
    // al enviarlo se guarda el elemento 5 (PUT); si no, se crea uno nuevo (POST).
    function modoEditar(form, id) {
      const [, tituloEditar] = TEXTOS[form.id];
      form.dataset.editando = id;
      form.closest('section').querySelector('h2').textContent = tituloEditar;
      form.querySelector('.boton:not(.cancelar)').textContent = 'Guardar cambios';
      form.querySelector('.cancelar').classList.remove('oculto');
      form.querySelector('.mensaje').classList.add('oculto');
      // Al editar no se cambia de curso: el desplegable se bloquea
      const selCurso = form.querySelector('.sel-curso');
      if (selCurso) selCurso.disabled = true;
      form.scrollIntoView({ behavior: 'smooth' });
    }

    function modoCrear(form) {
      const [tituloCrear, , botonCrear] = TEXTOS[form.id];
      delete form.dataset.editando;
      form.reset();
      form.closest('section').querySelector('h2').textContent = tituloCrear;
      form.querySelector('.boton:not(.cancelar)').textContent = botonCrear;
      form.querySelector('.cancelar').classList.add('oculto');
      const ayuda = form.querySelector('.ayuda');
      if (ayuda) ayuda.classList.add('oculto');
      const selCurso = form.querySelector('.sel-curso');
      if (selCurso) selCurso.disabled = false;
      if (form === formLeccion) proponerOrden();
    }

    document.querySelectorAll('.cancelar').forEach(boton =>
      boton.onclick = () => modoCrear(boton.closest('form')));

    // ---------- Cargar datos ----------
    async function cargarCursos() {
      const lista = await api('/api/cursos');
      // Pedimos el detalle de todos a la vez (Promise.all) en vez de uno detrás de otro
      const detalles = await Promise.all(lista.map(c => api('/api/cursos/' + c.id)));
      cursos = {};
      detalles.forEach(c => cursos[c.id] = c);
      pintarLista();
    }

    function pintarLista() {
      const html = Object.values(cursos).map(c => `
        <div class="tarjeta" style="margin-bottom:10px">
          <div class="fila" style="justify-content:space-between">
            <div>
              <strong>${esc(c.titulo)}</strong>
              <span class="etiqueta" style="margin:0 0 0 6px">${esc(c.categoria)}</span>
              <span class="precio" style="margin-left:6px">${Number(c.precio) === 0 ? 'Gratis' : c.precio + ' €'}</span>
            </div>
            <button class="chip" onclick="editarCurso(${c.id})">Editar curso</button>
          </div>
          <p style="margin:10px 0 4px"><strong>Lecciones</strong></p>
          ${c.lecciones.map(l => `
            <div class="fila" style="justify-content:space-between;margin-bottom:4px">
              <span>${l.orden}. ${esc(l.titulo)}
                <span class="ayuda">${l.tiene_video_propio ? '🎬 vídeo propio' : l.tiene_youtube ? '▶ YouTube' : 'sin vídeo'}</span>
              </span>
              <!-- <details> abre y cierra el menú solo, sin JavaScript -->
              <details class="opciones">
                <summary class="chip">Opciones ▾</summary>
                <div class="menu-opciones">
                  <button class="chip" onclick="editarLeccion(${l.id})">✏️ Editar</button>
                  ${l.tiene_youtube || l.tiene_video_propio
                    ? `<button class="chip" onclick="quitarVideo(${l.id})">🎬 Quitar vídeo</button>` : ''}
                  <button class="chip peligro" onclick="borrarLeccion(${l.id})">🗑️ Borrar lección</button>
                </div>
              </details>
            </div>`).join('') || '<p class="ayuda">Todavía no tiene lecciones.</p>'}
          <p style="margin:10px 0 4px"><strong>Materiales</strong></p>
          ${c.materiales.map(m => `
            <div class="fila" style="justify-content:space-between;margin-bottom:4px">
              <span>${esc(m.nombre)}${m.cantidad ? ' (' + esc(m.cantidad) + ')' : ''}</span>
              <span class="fila">
                <button class="chip" onclick="editarMaterial(${c.id}, ${m.id})">Editar</button>
                <button class="chip" onclick="borrarMaterial(${m.id})">Borrar</button>
              </span>
            </div>`).join('') || '<p class="ayuda">Todavía no tiene materiales.</p>'}
        </div>`).join('');
      document.getElementById('lista-cursos').innerHTML = html || '<p>Todavía no hay cursos.</p>';
    }

    async function cargarSelects() {
      const categorias = await api('/api/categorias');
      document.querySelectorAll('.sel-categoria').forEach(s =>
        s.innerHTML = categorias.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join(''));
      document.querySelectorAll('.sel-curso').forEach(s => {
        const elegido = s.value; // recordamos el curso elegido para no perderlo al recargar
        s.innerHTML = Object.values(cursos).map(c => `<option value="${c.id}">${esc(c.titulo)}</option>`).join('');
        if (elegido && cursos[elegido]) s.value = elegido;
      });
    }

    // Propone como orden "la última lección del curso + 1"
    function proponerOrden() {
      if (formLeccion.dataset.editando) return; // al editar se deja el orden que tiene
      const curso = cursos[formLeccion.curso_id.value];
      const ordenes = curso ? curso.lecciones.map(l => l.orden) : [];
      formLeccion.orden.value = ordenes.length ? Math.max(...ordenes) + 1 : 1;
    }
    formLeccion.curso_id.onchange = proponerOrden;

    // Después de crear o guardar algo, se recarga la lista y los desplegables
    async function recargar() {
      await cargarCursos();
      await cargarSelects();
      proponerOrden();
    }

    // ---------- Botones "Editar" y "Borrar" de la lista ----------
    function editarCurso(id) {
      const c = cursos[id];
      modoCrear(formCurso); // limpia lo que hubiera
      formCurso.titulo.value = c.titulo;
      formCurso.descripcion.value = c.descripcion || '';
      formCurso.categoria_id.value = c.categoria_id;
      formCurso.precio.value = c.precio;
      const ayuda = formCurso.querySelector('.ayuda');
      ayuda.textContent = c.imagen ? 'Si no eliges otra imagen, se queda la que tiene.' : 'Este curso todavía no tiene imagen.';
      ayuda.classList.remove('oculto');
      modoEditar(formCurso, id);
    }

    async function editarLeccion(id) {
      const l = await api('/api/lecciones/' + id); // aquí sí necesitamos el vídeo y el texto
      modoCrear(formLeccion);
      formLeccion.curso_id.value = l.curso_id;
      formLeccion.titulo.value = l.titulo;
      formLeccion.orden.value = l.orden;
      formLeccion.contenido.value = l.contenido || '';
      // El enlace NO se copia al campo: si lo copiáramos y luego eligieras un vídeo,
      // se enviarían los dos y el servidor lo rechazaría.
      const actual = l.video_local ? 'un vídeo propio' : l.video_url ? 'YouTube (' + l.video_url + ')' : 'ningún vídeo';
      const ayuda = formLeccion.querySelector('.ayuda');
      ayuda.textContent = `Ahora tiene ${actual}. Déjalo vacío para no cambiarlo, o pon un enlace nuevo o elige otro vídeo.`;
      ayuda.classList.remove('oculto');
      modoEditar(formLeccion, id);
    }

    function editarMaterial(cursoId, id) {
      const m = cursos[cursoId].materiales.find(m => m.id === id);
      modoCrear(formMaterial);
      formMaterial.curso_id.value = cursoId;
      formMaterial.nombre.value = m.nombre;
      formMaterial.cantidad.value = m.cantidad || '';
      modoEditar(formMaterial, id);
    }

    // Cierra los menús "Opciones" al elegir algo dentro o al pulsar fuera
    document.addEventListener('click', (e) => {
      document.querySelectorAll('details.opciones[open]').forEach(menu => {
        if (!menu.contains(e.target) || e.target.closest('.menu-opciones')) menu.open = false;
      });
    });

    // Si estábamos editando la lección que se quita o se borra, el formulario vuelve a "crear"
    function soltarSiSeEdita(id) {
      if (formLeccion.dataset.editando == id) modoCrear(formLeccion);
    }

    async function quitarVideo(id) {
      if (!confirm('¿Quitar el vídeo de esta lección? La lección, su texto y sus dudas se quedan.')) return;
      try {
        await api(`/api/lecciones/${id}/video`, { method: 'DELETE' });
        soltarSiSeEdita(id);
        await recargar();
      } catch (err) { alert(err.message); }
    }

    async function borrarLeccion(id) {
      if (!confirm('¿Borrar la lección entera? También se borrarán sus dudas, respuestas y el progreso de las alumnas en ella. No se puede deshacer.')) return;
      try {
        await api('/api/lecciones/' + id, { method: 'DELETE' });
        soltarSiSeEdita(id);
        await recargar();
      } catch (err) { alert(err.message); }
    }

    async function borrarMaterial(id) {
      if (!confirm('¿Borrar este material?')) return;
      try {
        await api('/api/cursos/materiales/' + id, { method: 'DELETE' });
        await recargar();
      } catch (err) { alert(err.message); }
    }

    // ---------- Enviar formularios ----------
    // Formularios con archivos → FormData; el resto → JSON
    formCurso.onsubmit = async (e) => {
      e.preventDefault();
      const id = formCurso.dataset.editando;
      try {
        await api(id ? '/api/cursos/' + id : '/api/cursos', { method: id ? 'PUT' : 'POST', body: new FormData(formCurso) });
        modoCrear(formCurso);
        await recargar();
        avisar(formCurso, id ? 'Cambios guardados ✅' : 'Curso creado ✅');
      } catch (err) { avisar(formCurso, err.message, true); }
    };

    formLeccion.onsubmit = async (e) => {
      e.preventDefault();
      const id = formLeccion.dataset.editando;
      // Aviso rápido antes de subir nada (el servidor lo vuelve a comprobar)
      if (formLeccion.video_url.value && formLeccion.video.files.length) {
        return avisar(formLeccion, 'Elige YouTube o vídeo propio, no los dos', true);
      }
      const boton = formLeccion.querySelector('.boton:not(.cancelar)');
      boton.disabled = true; // evita pulsar dos veces mientras sube el vídeo
      if (formLeccion.video.files.length) avisar(formLeccion, 'Subiendo el vídeo…');
      try {
        await api(id ? '/api/lecciones/' + id : '/api/lecciones', { method: id ? 'PUT' : 'POST', body: new FormData(formLeccion) });
        modoCrear(formLeccion);
        await recargar();
        avisar(formLeccion, id ? 'Cambios guardados ✅' : 'Lección creada ✅');
      } catch (err) { avisar(formLeccion, err.message, true); }
      boton.disabled = false;
    };

    formMaterial.onsubmit = async (e) => {
      e.preventDefault();
      const id = formMaterial.dataset.editando;
      const datos = { curso_id: formMaterial.curso_id.value, nombre: formMaterial.nombre.value, cantidad: formMaterial.cantidad.value };
      try {
        if (id) {
          await api('/api/cursos/materiales/' + id, { method: 'PUT', body: datos });
          modoCrear(formMaterial);
        } else {
          await api(`/api/cursos/${datos.curso_id}/materiales`, { method: 'POST', body: datos });
          // Al añadir, dejamos el curso elegido para poder meter varios materiales seguidos
          formMaterial.nombre.value = ''; formMaterial.cantidad.value = '';
        }
        await recargar();
        avisar(formMaterial, id ? 'Cambios guardados ✅' : 'Material añadido ✅');
      } catch (err) { avisar(formMaterial, err.message, true); }
    };

    document.getElementById('form-categoria').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/categorias', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
        e.target.reset();
        await cargarSelects();
        avisar(e.target, 'Categoría añadida ✅');
      } catch (err) { avisar(e.target, err.message, true); }
    };

    // ---------- Diseño del certificado ----------
    const formCertificado = document.getElementById('form-certificado');

    // Enseña la imagen que hay ahora y una casilla para quitarla
    function pintarImagenActual(contenedor, ruta, nombreCasilla) {
      document.getElementById(contenedor).innerHTML = ruta
        ? `<img src="${ruta}" alt="" style="max-height:70px;border-radius:6px;margin:4px 0">
           <label class="fila"><input type="checkbox" name="${nombreCasilla}" style="width:auto"> Quitar esta imagen</label>`
        : 'Ahora no hay ninguna.';
    }

    async function cargarDiseno() {
      const d = await api('/api/academia/certificado');
      formCertificado.directora.value = d.directora || '';
      formCertificado.color_texto.value = d.color_texto;
      pintarImagenActual('cert-fondo-actual', d.fondo, 'quitar_fondo');
      pintarImagenActual('cert-firma-actual', d.firma, 'quitar_firma');
    }

    formCertificado.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/academia/certificado', { method: 'PUT', body: new FormData(formCertificado) });
        formCertificado.fondo.value = ''; formCertificado.firma.value = '';
        await cargarDiseno();
        avisar(formCertificado, 'Diseño guardado ✅ Pulsa «Vista previa» para verlo.');
      } catch (err) { avisar(formCertificado, err.message, true); }
    };

    // ---------- Reportes ----------
    async function cargarReportes() {
      const reportes = await api('/api/reportes');
      document.getElementById('reportes').innerHTML = reportes.map(r => `
        <div class="tarjeta" style="margin-bottom:8px">
          <p><strong>${esc(r.tipo)} #${r.elemento_id}</strong> – ${esc(r.motivo)}</p>
          <div class="fila">
            <button class="chip" onclick="revisar(${r.id}, true)">Volver a mostrar</button>
            <button class="chip" onclick="revisar(${r.id}, false)">Mantener oculto</button>
          </div>
        </div>`).join('') || '<p>No hay reportes pendientes.</p>';
    }

    async function revisar(id, mostrar) {
      try {
        await api('/api/reportes/' + id, { method: 'PUT', body: { mostrar } });
        cargarReportes();
      } catch (err) { alert(err.message); }
    }

    // ---------- Al abrir la página ----------
    (async () => {
      const usuaria = await pintarCabecera();
      if (!usuaria || usuaria.perfil !== 'administradora') {
        document.querySelector('main').innerHTML = '<p class="mensaje">Solo la administradora puede ver este panel.</p>';
        return;
      }
      await recargar();
      cargarDiseno();
      cargarReportes();
    })();
  </script>
</body>
</html>
