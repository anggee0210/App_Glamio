<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLAMIO – Academia de belleza</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <a href="/index.html" class="logo">GLAMIO</a>
    <nav class="menu"></nav>
  </header>

  <main>
    <h1>Aprende, pregunta, calcula y muestra tu trabajo</h1>
    <div class="filtros" id="filtros"></div>
    <div class="rejilla" id="cursos"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function cargarCursos(categoria = '') {
      const cursos = await api('/api/cursos' + (categoria ? '?categoria=' + categoria : ''));
      document.getElementById('cursos').innerHTML = cursos.map(c => `
        <a class="tarjeta" href="/curso.html?id=${c.id}">
          ${c.imagen ? `<img src="${c.imagen}" alt="">` : ''}
          <span class="etiqueta">${esc(c.categoria)}</span>
          <h2>${esc(c.titulo)}</h2>
          <p>${esc(c.descripcion)}</p>
          <p class="precio">${Number(c.precio) === 0 ? 'Gratis' : c.precio + ' €'}
            ${c.media ? ' · ⭐ ' + c.media : ''}</p>
        </a>`).join('') || '<p>No hay cursos en esta categoría.</p>';
    }

    pintarCabecera();
    pintarFiltros(document.getElementById('filtros'), cargarCursos);
    cargarCursos();
  </script>
</body>
</html>
